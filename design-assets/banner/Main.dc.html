<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; }
    .display { font-family: 'Montserrat', 'Arial Black', system-ui, sans-serif; }
    .body { font-family: 'Open Sans', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 1024px; height: 500px; box-sizing: border-box; position: relative; overflow: hidden;
            background-color: #121826;
            background-image:
              radial-gradient(at 12% 18%, rgba(30,43,88,0.95) 0, transparent 55%),
              radial-gradient(at 92% 12%, rgba(74,163,163,0.30) 0, transparent 50%),
              radial-gradient(at 78% 100%, rgba(197,157,95,0.16) 0, transparent 55%);">

  <!-- faint concentric rings echo, top-right, for depth -->
  <svg width="520" height="520" viewBox="0 0 520 520" style="position:absolute; top:-150px; right:-120px; opacity:0.10;">
    <circle cx="260" cy="260" r="250" fill="none" stroke="#4AA3A3" stroke-width="2"/>
    <circle cx="260" cy="260" r="185" fill="none" stroke="#4AA3A3" stroke-width="2"/>
    <circle cx="260" cy="260" r="120" fill="none" stroke="#C59D5F" stroke-width="2"/>
  </svg>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 0 84px;
              display: flex; align-items: center; gap: 56px;">

    <!-- Brand mark: the target ring + gold core -->
    <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 20px;">
      <svg width="180" height="180" viewBox="0 0 180 180" aria-label="FinSight logo">
        <circle cx="90" cy="90" r="88" fill="#1E2B58"/>
        <circle cx="90" cy="90" r="86" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
        <circle cx="90" cy="90" r="54" fill="none" stroke="#4AA3A3" stroke-width="20"/>
        <circle cx="90" cy="90" r="15" fill="#C59D5F"/>
      </svg>
      <div class="display" style="font-weight: 900; font-size: 30px; letter-spacing: -0.5px; color: #ffffff;">
        FinS<span style="color:#4AA3A3;">1</span>ght
      </div>
    </div>

    <!-- Divider -->
    <div style="flex-shrink: 0; width: 1px; height: 300px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.14), transparent);"></div>

    <!-- Tagline block -->
    <div style="flex: 1; min-width: 0;">
      <div class="body" style="display:inline-block; font-weight: 700; font-size: 13px; letter-spacing: 3px;
                  text-transform: uppercase; color: #C59D5F; margin-bottom: 22px;">
        Personal Finance, Reimagined
      </div>
      <h1 class="display" style="margin: 0; font-weight: 800; font-size: 52px; line-height: 1.08;
                 letter-spacing: -1px; color: #ffffff; text-wrap: balance;">
        Master your money with the <span style="color:#4AA3A3;">50/30/20</span> rule
      </h1>
      <p class="body" style="margin: 22px 0 0; font-size: 21px; line-height: 1.5; font-weight: 600;
                color: rgba(226,232,240,0.82); max-width: 560px;">
        Private, local-first budgeting with AI-powered insights.
      </p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
